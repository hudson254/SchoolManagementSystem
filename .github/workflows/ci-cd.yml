name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '22'
  TEST_DB_NAME: sms_test
  TEST_DB_USER: testuser
  TEST_DB_PASSWORD: testpass123

jobs:
  backend-build:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sms_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass123
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready -U testuser -d sms_test
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/SMS.UnitTests/SMS.UnitTests.csproj --configuration Release --no-build --verbosity normal

      - name: Run API tests (PostgreSQL)
        env:
          ASPNETCORE_ENVIRONMENT: Testing
        run: dotnet test tests/SMS.ApiTests/SMS.ApiTests.csproj --configuration Release --no-build --verbosity normal

      - name: Run integration tests
        env:
          ASPNETCORE_ENVIRONMENT: Testing
        run: dotnet test tests/SMS.IntegrationTests/SMS.IntegrationTests.csproj --configuration Release --no-build --verbosity normal

  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/sms-web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend/sms-web

      - name: Lint
        run: npm run lint
        working-directory: frontend/sms-web
        continue-on-error: true

      - name: Run frontend tests
        run: npm test -- --run
        working-directory: frontend/sms-web

      - name: Build frontend
        run: npm run build
        working-directory: frontend/sms-web

      - name: npm audit
        run: npm audit --audit-level=moderate
        working-directory: frontend/sms-web

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          load: true
          tags: sms-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: false
          load: true
          tags: sms-web:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate production Docker Compose
        run: docker compose -f docker/docker-compose.prod.yml config --quiet

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sms_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass123
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready -U testuser -d sms_test
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build and start application
        run: |
          dotnet build src/SMS.API/SMS.API.csproj --configuration Release
          dotnet build frontend/sms-web --configuration Release

      - name: Install Playwright
        run: |
          npm init playwright@latest -- --yes --browser chromium
          npx playwright install chromium

      - name: Run E2E tests
        run: npx playwright test
        working-directory: e2e
        continue-on-error: true
