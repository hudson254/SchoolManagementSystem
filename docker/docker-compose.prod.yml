
services:
  # PostgreSQL Database - Production
  # Accessible only through the internal Docker network.
  # No host port is exposed. The API connects via the internal hostname "postgres".
  # For development/local access, use docker-compose.dev.yml which exposes port 5433.
  postgres:
    image: postgres:16-alpine
    container_name: sms-postgres
    environment:
      POSTGRES_DB: SchoolManagementSystem
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
      - ./init-db-rls.sql:/docker-entrypoint-initdb.d/init-db-rls.sql
    # Production: PostgreSQL is not exposed to the host. Only internal Docker network.
    # Health checks and API communication use the internal hostname "postgres".
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_user -d SchoolManagementSystem"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # API Backend (Production)
  # Runs HTTP-only behind the nginx reverse proxy which terminates TLS.
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: sms-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=SchoolManagementSystem;Username=sms_user;Password=${DB_PASSWORD}"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production}
      JWT__Issuer: ${JWT_ISSUER:-SMSAPI}
      JWT__Audience: ${JWT_AUDIENCE:-SMSWeb}
      JWT__ExpiryMinutes: ${JWT_EXPIRY:-60}
      TZ: Africa/Nairobi
      FileStorage__Path: /app/uploads
      Serilog__WriteTo__1__Args__path: /app/logs/sms-.log
      # Production CORS: must be set to the actual frontend URL
      Frontend__Url: ${FRONTEND_URL:?FRONTEND_URL is required in production}
      Cors__AllowedOrigins__0: ${FRONTEND_URL:?FRONTEND_URL is required in production}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_logs:/app/logs
      - api_data:/app/data
      - api_uploads:/app/uploads
      - api_dataprotection:/app/dataprotection-keys
    # Production: API port is not exposed to the host. nginx is the only entry point.
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - sms-network
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${API_URL:-/api/v1}
    container_name: sms-web
    environment:
      VITE_API_URL: ${API_URL:-/api/v1}
      VITE_APP_NAME: "School Management System"
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    container_name: sms-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /etc/ssl/private:/etc/ssl/private:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  backup:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backup
    container_name: sms-backup
    environment:
      DB_HOST: postgres
      DB_NAME: SchoolManagementSystem
      DB_USER: sms_user
      DB_PASSWORD: ${DB_PASSWORD}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_DIR: /backups
    volumes:
      - backup_data:/backups
      - ../scripts:/scripts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Alertmanager - Production: restricted to internal network only
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sms-alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    expose:
      - "9093"
    restart: unless-stopped
    networks:
      - sms-network
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://alertmanager:9093'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Node Exporter - Production: restricted to internal network only
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: sms-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - "9100"
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # PostgreSQL Exporter - Production: restricted to internal network only
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: sms-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://sms_user:${DB_PASSWORD}@postgres:5432/SchoolManagementSystem?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "9187"
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # cAdvisor - Production: restricted to internal network only
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: sms-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Alertmanager - Production: restricted to internal network
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sms-alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    expose:
      - "9093"
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Alertmanager Webhook Receiver (optional - for notification delivery without SMTP)
  # Uncomment and configure to receive webhook notifications from Alertmanager:
  # alertmanager-webhook:
  #   image: prometheuscommunity/alertmanager-webhook-receiver:latest
  #   container_name: sms-alertmanager-webhook
  #   expose:
  #     - "9099"
  #   restart: unless-stopped
  #   networks:
  #     - sms-network
  # Accessible to administrators via nginx reverse proxy or SSH tunnel
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sms-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    # Production: Prometheus is not exposed to the host. Access via internal network.
    # For admin access, use SSH tunnel or Grafana (which is also internal-only).
    expose:
      - "9090"
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'

  # Grafana - Production: restricted to internal network
  # Accessible to administrators via nginx reverse proxy or SSH tunnel
  grafana:
    image: grafana/grafana:11.2.0
    container_name: sms-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3001}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources:/etc/grafana/provisioning/datasources
    # Production: Grafana is not exposed to the host. Access via internal network.
    # For admin access, use SSH tunnel or configure nginx reverse proxy with auth.
    expose:
      - "3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  sms-network:
    driver: bridge

volumes:
  postgres_data:
  api_logs:
  api_data:
  api_uploads:
  backup_data:
  prometheus_data:
  grafana_data:
  api_dataprotection:
  alertmanager_data:
