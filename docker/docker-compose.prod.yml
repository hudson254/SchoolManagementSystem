
services:
  # PostgreSQL Database - Production
  # Accessible only through the internal Docker network.
  # No host port is exposed. The API connects via the internal hostname "postgres".
  # For development/local access, use docker-compose.dev.yml which exposes port 5433.
  postgres:
    image: postgres:16-alpine
    container_name: sms-postgres
    environment:
      POSTGRES_DB: SchoolManagementSystem
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      # Least-privilege role passwords, consumed ONCE by
      # 02-init-db-least-privilege-passwords.sh when the volume is first
      # initialised. They are never written to a file or an image layer, and
      # this script does not re-run on a restart of an existing volume, so an
      # established password can never be silently rotated. They are also
      # never logged: the assignment is a parameterised ALTER ROLE.
      SMS_DB_APP_PASSWORD: ${SMS_DB_APP_PASSWORD:?SMS_DB_APP_PASSWORD is required to provision the sms_app role}
      SMS_DB_MIGRATION_PASSWORD: ${SMS_DB_MIGRATION_PASSWORD:?SMS_DB_MIGRATION_PASSWORD is required to provision the sms_migration role}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Lexical order in /docker-entrypoint-initdb.d decides execution order,
      # hence the numeric prefixes. The roles MUST exist before the API's
      # first migration, because the API now connects as sms_app/sms_migration
      # rather than as this container's POSTGRES_USER.
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
      - ./init-db-rls.sql:/docker-entrypoint-initdb.d/init-db-rls.sql
      - ./init-db-least-privilege.sql:/docker-entrypoint-initdb.d/01-init-db-least-privilege.sql
      - ./init-db-least-privilege-passwords.sh:/docker-entrypoint-initdb.d/02-init-db-least-privilege-passwords.sh
    # Production: PostgreSQL is not exposed to the host. Only internal Docker network.
    # Health checks and API communication use the internal hostname "postgres".
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_user -d SchoolManagementSystem"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # API Backend (Production)
  # Runs HTTP-only behind the nginx reverse proxy which terminates TLS.
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: sms-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      # ----------------------------------------------------------------
      # Least-privilege runtime wiring. This is the correction that makes
      # ENABLE ROW LEVEL SECURITY mean something: sms_user is the cluster
      # bootstrap SUPERUSER with BYPASSRLS, so connecting as it bypassed all
      # 70 RLS-enabled tables and their 280 policies. The API must not use it.
      #
      #   DefaultConnection    -> sms_app        (NOSUPERUSER, NOBYPASSRLS)
      #   MigrationConnection  -> sms_migration  (NOBYPASSRLS, owns the tables)
      #
      # The two passwords are separate secrets and neither is hard-coded. The
      # migration password is confined to this one variable: it is needed for
      # `docker compose run --rm api migrate-database` / `seed-data` and is
      # not referenced by DefaultConnection or by any other service.
      # ----------------------------------------------------------------
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=SchoolManagementSystem;Username=sms_app;Password=${SMS_DB_APP_PASSWORD:?SMS_DB_APP_PASSWORD is required}"
      ConnectionStrings__MigrationConnection: "Host=postgres;Database=SchoolManagementSystem;Username=sms_migration;Password=${SMS_DB_MIGRATION_PASSWORD:?SMS_DB_MIGRATION_PASSWORD is required}"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required for seeding}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required for seeding}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-System}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Administrator}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required in production}
      JWT__Issuer: ${JWT_ISSUER:-SMSAPI}
      JWT__Audience: ${JWT_AUDIENCE:-SMSWeb}
      JWT__ExpiryMinutes: ${JWT_EXPIRY:-60}
      TZ: Africa/Nairobi
      FileStorage__Path: /app/uploads
      Serilog__WriteTo__1__Args__path: /app/logs/sms-.log
      # Production CORS: must be set to the actual frontend URL
      Frontend__Url: ${FRONTEND_URL:?FRONTEND_URL is required in production}
      Cors__AllowedOrigins__0: ${FRONTEND_URL:?FRONTEND_URL is required in production}
      # OMS (Order Management System) configuration.
      # Compose defaults MUST use the ${VAR:-default} form; ${VAR:default} is not
      # valid interpolation syntax and aborts `docker compose config`.
      RoadsDb__File: ${ROADS_DB_FILE:-/app/data/roads.db}
      WALRecovery__Target: ${WAL_RECOVERY_TARGET:-latest}
      WALRecovery__RecoveryPath: ${WAL_RECOVERY_PATH:-/app/data/wal-recovery}
      OrderManifestStorage__Enabled: ${ORDER_MANIFEST_STORAGE_ENABLED:-true}
      OrderManifestStorage__BasePath: ${ORDER_MANIFEST_STORAGE_PATH:-/app/data/order-manifests}
      OrderManifestStorage__FilePrefix: ${ORDER_MANIFEST_FILE_PREFIX:-order-manifest-}
      OrderManifestStorage__FileExtension: .json
      OrderManifestStorage__RetentionDays: ${ORDER_MANIFEST_RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_logs:/app/logs
      - api_data:/app/data
      - api_uploads:/app/uploads
      - api_dataprotection:/app/dataprotection-keys
      # NOTE: roads.db, /wal-recovery and /order-manifests all live under
      # /app/data, which is already the api_data volume below. Do NOT add a
      # second volume on /app/data: the later mount silently shadows the first
      # one, which would hide the existing production data in api_data.
    # Production: API port is not exposed to the host. nginx is the only entry point.
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - sms-network
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${API_URL:-/api/v1}
    container_name: sms-web
    environment:
      VITE_API_URL: ${API_URL:-/api/v1}
      VITE_APP_NAME: "School Management System"
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    container_name: sms-nginx
    volumes:
      # ── Deployment-safety: MOUNT THE DIRECTORY, NOT THE FILE ──────────────
      # This previously read:
      #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # A single-FILE bind mount is resolved to one inode when the container is
      # created. `git checkout` REPLACES the file (new inode, new device) rather
      # than rewriting it in place, so the running container kept the PREVIOUS
      # configuration indefinitely while the repository showed the new one. That
      # produced a real stale-config condition during the 997e44c deployment: the
      # service-worker cache-header fix was in the repo but the live server was
      # still serving the old config, and only an explicit container recreate
      # resolved it.
      #
      # Mounting the whole ./nginx directory inverts that. The mount is
      # directory-scoped, so a replaced file inside it is visible immediately,
      # and `nginx -t` + `nginx -s reload` pick up the new content in place -
      # with no downtime and no dependency on a recreate.
      - ./nginx:/etc/nginx/sms:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /etc/ssl/private:/etc/ssl/private:ro
    # Point nginx at the mounted directory explicitly. The image's own
    # /etc/nginx/nginx.conf is left untouched and still owns mime.types and the
    # standard include paths.
    command: ["nginx", "-c", "/etc/nginx/sms/nginx.conf", "-g", "daemon off;"]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  backup:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backup
    container_name: sms-backup
    environment:
      DB_HOST: postgres
      DB_NAME: SchoolManagementSystem
      DB_USER: sms_user
      DB_PASSWORD: ${DB_PASSWORD}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_DIR: /backups
    volumes:
      - backup_data:/backups
      - backup_metrics_data:/var/lib/node_exporter/textfile_collector
      - ../scripts:/scripts
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Alertmanager - Production: restricted to internal network only
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sms-alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    expose:
      - "9093"
    restart: unless-stopped
    networks:
      - sms-network
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://alertmanager:9093'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Node Exporter - Production: restricted to internal network only
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: sms-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - backup_metrics_data:/var/lib/node_exporter/textfile_collector:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.textfile.directory=/var/lib/node_exporter/textfile_collector'
    expose:
      - "9100"
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # PostgreSQL Exporter - Production: restricted to internal network only
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: sms-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://sms_user:${DB_PASSWORD}@postgres:5432/SchoolManagementSystem?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "9187"
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # cAdvisor - Production: restricted to internal network only
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: sms-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M


  # Alertmanager Webhook Receiver (optional - for notification delivery without SMTP)
  # Uncomment and configure to receive webhook notifications from Alertmanager:
  # alertmanager-webhook:
  #   image: prometheuscommunity/alertmanager-webhook-receiver:latest
  #   container_name: sms-alertmanager-webhook
  #   expose:
  #     - "9099"
  #   restart: unless-stopped
  #   networks:
  #     - sms-network
  # Accessible to administrators via nginx reverse proxy or SSH tunnel
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: sms-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml
      - prometheus_data:/prometheus
    # Production: Prometheus is not exposed to the host. Access via internal network.
    # For admin access, use SSH tunnel or Grafana (which is also internal-only).
    expose:
      - "9090"
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'

  # Grafana - Production: restricted to internal network
  # Accessible to administrators via nginx reverse proxy or SSH tunnel
  grafana:
    image: grafana/grafana:11.2.0
    container_name: sms-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3001}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources:/etc/grafana/provisioning/datasources
    # Production: Grafana is not exposed to the host. Access via internal network.
    # For admin access, use SSH tunnel or configure nginx reverse proxy with auth.
    expose:
      - "3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  sms-network:
    driver: bridge

volumes:
  postgres_data:
  api_logs:
  api_data:
  api_uploads:
  backup_data:
  backup_metrics_data:
  prometheus_data:
  grafana_data:
  api_dataprotection:
  alertmanager_data:
