
services:
  postgres:
    image: postgres:16-alpine
    container_name: sms-postgres-dev
    environment:
      POSTGRES_DB: SchoolManagementSystem
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePassword123!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_user -d SchoolManagementSystem"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sms-dev-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sms-pgadmin-dev
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@school.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - sms-dev-network

  # API Backend (Development)
  # Runs HTTP-only behind the nginx reverse proxy which terminates TLS.
  # See docker-compose.yml for the root-cause analysis of the 502 issue.
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: sms-api-dev
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=SchoolManagementSystem;Username=sms_user;Password=${DB_PASSWORD:-SecurePassword123!}"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-min-64-characters-long-for-development-only}
      JWT__Issuer: SMSAPI
      JWT__Audience: SMSWeb
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_dev_logs:/app/logs
      - ../src:/src
    ports:
      - "5000:80"
    restart: unless-stopped
    networks:
      - sms-dev-network
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: sms-web-dev
    environment:
      VITE_API_URL: /api
      VITE_APP_NAME: "School Management System (Dev)"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - sms-dev-network

  nginx:
    image: nginx:alpine
    container_name: sms-nginx-dev
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl/certs:ro
      - ./certs:/etc/ssl/private:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sms-dev-network

networks:
  sms-dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
  pgadmin_dev_data:
  api_dev_logs:
