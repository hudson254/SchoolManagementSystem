# School Management System - frontend site configuration.
# Mounted/copied to /etc/nginx/conf.d/default.conf by:
#   - Dockerfile.frontend (SPA container, listens :80)
#   - Dockerfile.nginx    (reverse proxy image, listens :80)
#
# This file MUST contain only a server block (no events {} / http {}),
# matching the existing docker/nginx.conf behaviour for the API routes.
# RISK-26: /uploads/ is proxied to the api service which serves uploaded
# files via UseStaticFiles (RequestPath = /uploads).
#
# The `map` below sits OUTSIDE the server block, before it. This file is
# included from the image's main nginx.conf inside `http { ... }`, so a `map`
# directive here is valid: `map` is legal in the http context, while `events {}`
# and `http {}` are not. It defines $connection_upgrade, used by the hub block
# below, with the same semantics as in docker/nginx.conf.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Uploads limit (mirrors docker/nginx.conf)
    client_max_body_size 100M;

    # Root and index
    root /usr/share/nginx/html;
    index index.html;

    # Static files caching
    # Build assets are content-hashed by Vite, so a year-long immutable cache is
    # correct for them.
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The service worker MUST be revalidated on every navigation. It previously fell
    # into the block above and was served `immutable` for a year, which pinned the
    # browser to the first worker it downloaded: a newly deployed frontend could
    # never reach an already-installed client. See Documentation/Notifications-PWA.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        try_files $uri =404;
    }

    # Same for the manifest: icon set and shortcuts change between deployments and a
    # stale copy blocks installability changes from taking effect.
    location = /manifest.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    # index.html references the hashed asset URLs, so caching it pins the user to
    # the previous build.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires -1;
    }

    # API requests -> api service
    location /api/ {
        proxy_pass http://api:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SignalR hub -> api service (websocket upgrade, NO redirect).
    # Mirrors `location ^~ /hub` in docker/nginx.conf. `/hub` does not match a
    # bare `location /hub/`, so it used to fall through to the SPA's
    # `try_files $uri $uri/` below, which made nginx answer `301 -> /hub/`.
    # A WebSocket handshake cannot follow an HTTP redirect, so the socket never
    # opened. `^~` matches /hub, /hub/ and /hub/negotiate, and the upstream has
    # no URI part so the path and query string pass through unchanged.
    location ^~ /hub {
        proxy_pass http://api:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        # A hub socket is idle most of the time by design; a short read timeout
        # would kill healthy connections.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Swagger UI -> api service
    location /swagger/ {
        proxy_pass http://api:80/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health checks -> api service
    location = /health {
        proxy_pass http://api:80/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # Uploaded files -> api service (RISK-26)
    # The API serves files from the FileStorage:Path directory (default
    # "uploads") at the /uploads/ request path via UseStaticFiles.
    location /uploads/ {
        proxy_pass http://api:80/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: any other route serves the frontend index
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
