# School Management System - frontend site configuration.
# Mounted/copied to /etc/nginx/conf.d/default.conf by:
#   - Dockerfile.frontend (SPA container, listens :80)
#   - Dockerfile.nginx    (reverse proxy image, listens :80)
#
# This file MUST contain only a server block (no events {} / http {}),
# matching the existing docker/nginx.conf behaviour for the API routes.
# NOTE: /uploads/ proxying belongs to a separate repair item (RISK-26).

server {
    listen 80;
    server_name _;

    # Uploads limit (mirrors docker/nginx.conf)
    client_max_body_size 100M;

    # Root and index
    root /usr/share/nginx/html;
    index index.html;

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API requests -> api service
    location /api/ {
        proxy_pass http://api:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SignalR hub -> api service (websocket upgrade)
    location /hub/ {
        proxy_pass http://api:80/hub/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Swagger UI -> api service
    location /swagger/ {
        proxy_pass http://api:80/swagger/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health checks -> api service
    location = /health {
        proxy_pass http://api:80/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # SPA fallback: any other route serves the frontend index
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
