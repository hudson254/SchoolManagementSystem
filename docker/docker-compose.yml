services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sms-postgres
    environment:
      POSTGRES_DB: SchoolManagementSystem
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
      - ./init-db-rls.sql:/docker-entrypoint-initdb.d/init-db-rls.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_user -d SchoolManagementSystem"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # API Backend
  # Runs HTTP-only behind the nginx reverse proxy which terminates TLS.
  # Previously configured with ASPNETCORE_URLS=https://+:443;http://+:80 and a
  # certificate mount that was unavailable at deploy time. When Kestrel could
  # not load the cert it crashed the entire process (including the HTTP
  # endpoint), so nginx had no upstream to proxy to and returned 502.
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: sms-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=SchoolManagementSystem;Username=sms_user;Password=${DB_PASSWORD:?DB_PASSWORD must be set}"
      JWT_SECRET: ${JWT_SECRET}
      JWT__Issuer: ${JWT_ISSUER:-SMSAPI}
      JWT__Audience: ${JWT_AUDIENCE:-SMSWeb}
      JWT__ExpiryMinutes: ${JWT_EXPIRY:-60}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_logs:/app/logs
      - api_data:/app/data
      - api_uploads:/app/uploads
    ports:
      - "5000:80"
    restart: unless-stopped
    networks:
      - sms-network
    healthcheck:
      test:
        ["CMD-SHELL", "curl --silent --fail http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # React Frontend
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: sms-web
    environment:
      VITE_API_URL: /api
      VITE_APP_NAME: "School Management System"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sms-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/ssl/certs:ro
      - ./certs:/etc/ssl/private:ro
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # Automated Backup Service
  backup:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backup
    container_name: sms-backup
    environment:
      DB_HOST: postgres
      DB_NAME: SchoolManagementSystem
      DB_USER: sms_user
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_DIR: /backups
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: sms-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: sms-grafana
    environment:
      # RISK-20: no insecure default fallback. GRAFANA_PASSWORD must be
      # supplied via the environment, otherwise compose fails with a warning.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
# Alertmanager
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: sms-alertmanager
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:9093'
networks:
  sms-network:
    driver: bridge
volumes:
  postgres_data:
  api_logs:
  api_data:
  api_uploads:
  backup_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:
