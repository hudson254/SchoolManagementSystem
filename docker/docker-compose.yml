version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sms-postgres
    environment:
      POSTGRES_DB: SchoolManagementSystem
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SecurePassword123!}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_user -d SchoolManagementSystem"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # API Backend
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: sms-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: https://+:443;http://+:80
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/localhost.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${SSL_PASSWORD:-password}
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=SchoolManagementSystem;Username=sms_user;Password=${DB_PASSWORD:-SecurePassword123!}"
      JWT__Secret: ${JWT_SECRET}
      JWT__Issuer: ${JWT_ISSUER:-SMSAPI}
      JWT__Audience: ${JWT_AUDIENCE:-SMSWeb}
      JWT__ExpiryMinutes: ${JWT_EXPIRY:-60}
      SMTP__Host: ${SMTP_HOST}
      SMTP__Port: ${SMTP_PORT:-587}
      SMTP__Username: ${SMTP_USERNAME}
      SMTP__Password: ${SMTP_PASSWORD}
      SMTP__From: ${SMTP_FROM}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - api_logs:/app/logs
      - api_data:/app/data
      - /etc/ssl/localhost.pfx:/https/localhost.pfx:ro
    ports:
      - "5000:80"
      - "5001:443"
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # React Frontend
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: sms-web
    environment:
      VITE_API_URL: https://localhost:5001/api
      VITE_APP_NAME: "School Management System"
    depends_on:
      - api
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sms-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /etc/ssl/private:/etc/ssl/private:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Automated Backup Service
  backup:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backup
    container_name: sms-backup
    environment:
      DB_HOST: postgres
      DB_NAME: SchoolManagementSystem
      DB_USER: sms_user
      DB_PASSWORD: ${DB_PASSWORD:-SecurePassword123!}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_DIR: /backups
    volumes:
      - backup_data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: sms-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: sms-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana-datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - sms-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sms-network:
    driver: bridge

volumes:
  postgres_data:
  api_logs:
  api_data:
  backup_data:
  prometheus_data:
  grafana_data: