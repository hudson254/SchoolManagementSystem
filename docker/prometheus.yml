# School Management System - Prometheus configuration.
#
# Prometheus scrapes the SMS API's /metrics endpoint for application-level
# metrics (request count, duration, auth failures, etc.) and the /health
# endpoint for availability monitoring.
#
# The /metrics endpoint is served by the MetricsMiddleware on the same port
# as the API (port 80). In production, restrict access to the monitoring
# VLAN via nginx or firewall rules.
#
# Scrape interval is intentionally aligned with the compose healthcheck cadence.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting configuration - sends alerts to Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"
      timeout: 10s
      api_version: v2

# Rule files for alerting
rule_files:
  - "prometheus-alerts.yml"

scrape_configs:
  # --- Prometheus self-monitoring ---
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          application: "prometheus"
          environment: "production"

  # --- SMS API application metrics ---
  - job_name: "sms-api-metrics"
    metrics_path: "/metrics"
    scheme: http
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "api:80"
        labels:
          application: "sms-api"
          environment: "production"
          component: "aspnet-core"
          service: "sms-api"

  # --- SMS API availability (infrastructure-level probe) ---
  - job_name: "sms-api-health"
    metrics_path: "/health"
    scheme: http
    scrape_interval: 30s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - "api:80"
        labels:
          application: "sms-api"
          environment: "production"
          component: "health-check"
          service: "sms-api"

  # --- Node Exporter (host-level metrics) ---
  - job_name: "node"
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          application: "host-metrics"
          environment: "production"
          service: "node-exporter"

  # --- PostgreSQL Exporter (database metrics) ---
  - job_name: "postgresql"
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "postgres-exporter:9187"
        labels:
          application: "postgresql"
          environment: "production"
          service: "postgres-exporter"

  # --- cAdvisor (container-level metrics) ---
  - job_name: "cadvisor"
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - "cadvisor:8080"
        labels:
          application: "container-metrics"
          environment: "production"
          service: "cadvisor"

  # --- Alertmanager self-monitoring ---
  - job_name: "alertmanager"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "alertmanager:9093"
        labels:
          application: "alertmanager"
          environment: "production"
          service: "alertmanager"
