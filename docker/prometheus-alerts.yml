# School Management System - Prometheus Alerting Rules
#
# These alerts fire when the defined conditions are met.
# Alertmanager must be configured separately for notification delivery.

groups:
  - name: sms-infrastructure
    interval: 30s
    rules:
      # --- API Availability ---
      - alert: APIUnavailable
        expr: up{job="sms-api-metrics"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SMS API is unavailable"
          description: "The SMS API Prometheus metrics endpoint has been unavailable for more than 1 minute."

      # --- Database Availability ---
      - alert: DatabaseUnavailable
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL database is unavailable"
          description: "The PostgreSQL database health check has failed for more than 1 minute."

      # --- Container Restart Loops ---
      - alert: ContainerRestartLoop
        expr: changes(container_start_time_seconds{name=~"sms-.*"}[15m]) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} restarted repeatedly"
          description: "Container {{ $labels.name }} has restarted more than once in the last 15 minutes."

      # --- Disk Space ---
      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space critically low on {{ $labels.instance }}"
          description: "Disk space is below 10% on {{ $labels.instance }} ({{ $value }}% available)."

      - alert: DiskSpaceWarning
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space low on {{ $labels.instance }}"
          description: "Disk space is below 20% on {{ $labels.instance }} ({{ $value }}% available)."

      # --- High Memory Usage ---
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 90% on {{ $labels.instance }} ({{ $value }}%)."

      # --- High CPU Usage ---
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 90% on {{ $labels.instance }} ({{ $value }}%)."

      # --- PostgreSQL Connection Exhaustion ---
      - alert: PostgreSQLConnectionExhaustion
        expr: pg_stat_activity_count > pg_settings_max_connections * 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections high on {{ $labels.instance }}"
          description: "PostgreSQL connections are above 80% of max_connections on {{ $labels.instance }}."

      # --- Prometheus Target Down ---
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target {{ $labels.instance }} is down"
          description: "Prometheus target {{ $labels.instance }} (job: {{ $labels.job }}) has been down for more than 1 minute."

      # --- Backup Status ---
      - alert: BackupNotRunning
        expr: time() - sms_backup_last_success_timestamp_seconds > 86400
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Database backup has not completed in the last 24 hours"
          description: "The last successful School Management System database backup was more than 24 hours ago."
