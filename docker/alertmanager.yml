# School Management System - Alertmanager Configuration
#
# Production alert routing for the SMS monitoring stack.
# Notification credentials should be provided via environment variables.
#
# SMTP is intentionally DISABLED for this LAN-only deployment.
# Notification delivery uses webhook (if configured) or logs to console.
#
# To enable SMTP notification:
#   Set ALERTMANAGER_SMTP_FROM, ALERTMANAGER_SMTP_SMART_HOST,
#   ALERTMANAGER_SMTP_USERNAME, ALERTMANAGER_SMTP_PASSWORD
#   AND set smtp_require_tls: true for production email.

global:
  # Default timezone for notifications
  resolve_timeout: 5m

  # Email notification configuration (DISABLED by default for LAN deployment)
  # To enable, set the below environment variables and change smtp_require_tls to true.
  smtp_from: ""  # Intentionally empty - SMTP disabled
  smtp_smarthost: ""  # Intentionally empty - SMTP disabled
  smtp_auth_username: ""
  smtp_auth_password: ""
  smtp_require_tls: false

# Root route - default catch-all
route:
  receiver: "default"
  group_by:
    - alertname
    - severity
    - service
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  # Route critical alerts to a separate receiver with shorter repeat interval
  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h
      group_wait: 10s
      group_interval: 1m

# Inhibition rules to prevent alert storms
inhibit_rules:
  # If API is down, suppress container-level alerts for API containers
  - source_match:
      severity: critical
      alertname: APIUnavailable
    target_match:
      service: sms-api
    equal: ["instance"]

  # If node is down, suppress all container alerts on that node
  - source_match:
      severity: critical
      alertname: PrometheusTargetDown
    target_match_re:
      severity: critical|warning
    equal: ["instance"]

  # If database is down, suppress dependent alerts
  - source_match:
      severity: critical
      alertname: DatabaseUnavailable
    target_match:
      service: postgres-exporter
    equal: ["instance"]

receivers:
  # Default receiver - logs to Alertmanager console and forwards to webhook if configured
  - name: "default"
    webhook_configs:
      - url: "http://localhost:9099/alertmanager/webhook"  # Configure your webhook receiver URL here
        send_resolved: true
    # Include a slack_configs example for reference (commented out):
    # slack_configs:
    #   - api_url: ${ALERTMANAGER_SLACK_WEBHOOK_URL}
    #     channel: "#alerts"
    #     send_resolved: true

  # Critical alerts receiver - same destination but can be separate
  - name: "critical"
    webhook_configs:
      - url: "http://localhost:9099/alertmanager/webhook"  # Configure your webhook receiver URL here
        send_resolved: true
